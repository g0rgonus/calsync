[project]
name = "calsync"
version = "0.1.0"
description = "Normalize kids' schedules from feeds, PDFs and messages into one calendar"
requires-python = ">=3.11"
dependencies = ["icalendar>=6.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
