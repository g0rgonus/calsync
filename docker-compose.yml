x-env: &env
  env_file:
    - path: .env
      required: false
  environment:
    CALSYNC_DB: /data/calsync.db
    CALSYNC_SECRETS: /run/secrets/calsync/secrets.json
    CALSYNC_SETTING_RADICALE_URL: ${CALSYNC_SETTING_RADICALE_URL:-http://radicale:5232}

# `image` and `build` both: Compose builds only when the image is absent
# locally, so this serves a pull and a checkout.
x-calsync: &calsync
  <<: *env
  image: ghcr.io/g0rgonus/calsync:${CALSYNC_TAG:-release}
  build: .
  restart: unless-stopped

x-health: &health
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 5s

x-needs-bootstrap: &needs-bootstrap
  bootstrap:
    condition: service_completed_successfully

services:
  bootstrap:
    <<: *calsync
    user: "0:0"
    command: ["bootstrap", "/deploy"]
    restart: "no"
    volumes:
      - ./config:/deploy/config
      - ./secrets:/deploy/secrets

  radicale:
    image: tomsquest/docker-radicale:latest
    restart: unless-stopped
    depends_on: *needs-bootstrap
    volumes:
      - radicale-data:/data
      - ./config/radicale:/config:ro
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fsS", "http://localhost:5232/", "-o", "/dev/null"]
      retries: 5
      start_period: 10s

  calsync:
    <<: *calsync
    depends_on:
      <<: *needs-bootstrap
      radicale:
        condition: service_healthy
    volumes:
      - calsync-data:/data
      - ./secrets:/run/secrets/calsync:ro
      - ./config/calsync:/config:ro

  web:
    <<: *calsync
    command: ["web", "--host", "0.0.0.0", "--port", "8730"]
    depends_on: *needs-bootstrap
    volumes:
      - calsync-data:/data
      - ./secrets:/run/secrets/calsync
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8730/')"]

  api:
    <<: *calsync
    profiles: ["api"]
    command: ["api", "--host", "0.0.0.0", "--port", "8731"]
    depends_on: *needs-bootstrap
    volumes:
      - calsync-data:/data
      - ./secrets:/run/secrets/calsync:ro
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c",
             "import http.client as h; c=h.HTTPConnection('localhost',8731,timeout=3); c.request('GET','/v1/events'); raise SystemExit(0 if c.getresponse().status==401 else 1)"]

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: *needs-bootstrap
    ports:
      - 8730:80
    volumes:
      - ./config/caddy:/etc/caddy:ro

  feeds:
    profiles: ["demo"]
    image: python:3.12-slim
    restart: unless-stopped
    command: ["python", "/demo/feeds.py", "--port", "8000"]
    volumes:
      - ./demo:/demo:ro
      - ./tests/fixtures:/tests/fixtures:ro
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  radicale-data:
  calsync-data:
