version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # The pinned server images in docker-compose.yml and the Dockerfile's base.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Radicale's image also carries build-number tags that sort above every release.
      - dependency-name: tomsquest/docker-radicale
        versions: [">= 100"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
