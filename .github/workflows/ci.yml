# Build the image, and prove the thing inside it works.
#
# A workflow that only ran `docker build` would go green on an image whose sync
# loop is broken — the build does not import the package, let alone exercise it.
# So the image job is last and depends on the tests.
#
# The acceptance job is the one worth having. `docs/deployment/radicale.md`
# records that the R1-R8 server requirements were once verified by hand, against
# a server that no longer exists, on a version nobody pinned. That is the
# weakest link in the project: every other layer has fast offline tests, and the
# one place calsync meets a real CalDAV server was checked manually. Running it
# on every push is what `scripts/dev-stack.sh` was written to make possible.

name: CI

on:
  push:
    branches: ["**"]
    # Without this a tag push fires nothing, so the semver image tags the
    # metadata step is configured to produce are never actually produced —
    # `latest` and `sha-` get published and there is no version to pin to.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # The floor from pyproject. Testing the oldest supported version is
          # the useful end: a newer one passing says nothing about it.
          python-version: "3.11"
      - run: pip install -e '.[dev]'
      - run: pytest -q

  acceptance:
    name: acceptance (live Radicale)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e '.[dev]'
      - name: Bring up the stack
        run: scripts/dev-stack.sh
      # Through the proxy, on the stack's one published port, because that is
      # what the acceptance suite now talks to. It waits on both halves at
      # once: a 502 here is the proxy up and Radicale not.
      - name: Wait for Radicale, through the proxy
        run: |
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8730/cal/ -o /dev/null && exit 0
            sleep 2
          done
          echo "Radicale never came up at /cal" >&2
          docker compose logs radicale proxy
          exit 1
      - name: Run the acceptance checks
        env:
          CALSYNC_ACCEPTANCE: "1"
        run: pytest tests/test_acceptance.py -q
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs

  deploy:
    name: deploy (linux first run)
    runs-on: ubuntu-latest
    # The documented first run, followed exactly, on Linux — where bind-mount
    # ownership behaves differently from macOS and every deployment bug so far
    # has lived. `dev-stack.sh` does not cover it: it lays out config/ from the
    # checkout, where a deployment takes it from the image.
    steps:
      - uses: actions/checkout@v5
      - name: Follow the documented first run
        run: |
          set -eux
          # The documented first run, exactly: one command, then up. Config and
          # .env both come from the image, the way a pulled deployment gets them.
          docker compose build calsync
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/out" \
            ghcr.io/g0rgonus/calsync:release init-deploy /out
          # Everything the stack needs, and nothing it does not.
          test "$(stat -c '%a' .env)" = "600"
          test "$(grep -c '^CALSYNC_SECRET.*=.' .env)" -eq 3
          test -s config/radicale/config
          test -s config/radicale/rights
          test -s config/radicale/rights.anonymous
          test -s config/caddy/Caddyfile
          # --build, because compose pulls the published image when one exists
          # in the registry. Without it this job tests the last release against
          # this branch's compose file, which is not what it is for.
          docker compose up -d --build

      - name: No credential is written to the host
        run: |
          set -eux
          # The whole point of deriving the users file inside the container: the
          # only place a password exists on this machine is .env.
          test ! -e config/radicale/users
          test ! -e secrets/secrets.json
          # And the file Radicale actually reads is in its container, 0600.
          docker compose exec -T radicale sh -c 'test "$(stat -c %a /tmp/users)" = 600'
          docker compose exec -T radicale sh -c 'test "$(wc -l < /tmp/users)" -eq 2'

      - name: Radicale runs as its own account, not root
        run: |
          set -eux
          # The image only drops privileges when told to run radicale directly,
          # and this stack gives it a shell — so `user:` is what keeps it off
          # root, and nothing else would notice if that line went.
          test "$(docker compose exec -T radicale id -u)" = "2999"

      - name: The poller stays up, which means the check passed
        run: |
          set -eux
          # Long enough for the seed, the startup check and a first pass. A
          # poller that could not reach its calendar exits 1 here instead of
          # running on writing nothing, which is the whole point of the check.
          sleep 30
          test "$(docker compose ps -q calsync | wc -l)" -eq 1
          docker compose ps --status running calsync | grep -q calsync

      - name: The configured password authenticates against the real server
        run: |
          set -eux
          docker compose run --rm calsync check
          docker compose run --rm calsync status

      - name: The one published port serves all three paths
        run: |
          set -eux
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8730/ -o /dev/null && break
            sleep 2
          done
          curl -fsS http://localhost:8730/ -o /dev/null
          curl -fsS http://localhost:8730/.well-known/caldav -o /dev/null
          # Radicale under a path with its prefix intact — a CalDAV client
          # follows the hrefs in this body, so an unprefixed one is an
          # autodiscovery failure that looks like a bad password.
          pw=$(grep '^CALSYNC_SECRET_RADICALE_PASSWORD=' .env | cut -d= -f2-)
          curl -fsS -u "calsync:$pw" \
            -X PROPFIND -H 'Depth: 0' http://localhost:8730/cal/ | grep -q '<href>/cal/'
          token=$(grep '^CALSYNC_SECRET_API_TOKEN=' .env | cut -d= -f2-)
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $token" http://localhost:8730/v1)" = "200"

      - name: A restart changes no credential
        run: |
          set -eux
          # Derived on every start, so the property to hold is that the same
          # .env keeps producing the same working pair — a changed one would
          # lock out every subscribed device. A second init-deploy must not
          # touch it either.
          before=$(sha256sum .env)
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/out" \
            ghcr.io/g0rgonus/calsync:release init-deploy /out
          test "$(sha256sum .env)" = "$before"
          docker compose up -d --build
          sleep 10
          docker compose run --rm calsync check

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs

  image:
    name: image
    runs-on: ubuntu-latest
    # All three, because an image that builds, cannot sync, or cannot be
    # deployed by following its own instructions is not worth publishing.
    needs: [tests, acceptance, deploy]
    # A pull_request run builds the same commit as the push run that triggered
    # it, from a merge ref whose `ref_name` is "6/merge" — so publishing from
    # both means every PR pushes a second, identically-contented image under a
    # channel name nobody asked for. The push run is the one that publishes.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      # arm64 is emulated on an amd64 runner. Slower, and the alternative is a
      # second runner and a manifest-merge step for an image whose build is
      # `pip install` and nothing else.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Three channels, because one moving tag cannot mean "what I run",
          # "what is merged" and "what I would give a stranger" at once — and
          # while this repo was private it meant whichever branch was pushed
          # last, which is the worst of the three to hand somebody.
          #
          #   release  the newest tagged version. What the README points at.
          #   latest   main. Merged, tested, not yet declared a version.
          #   dev      a feature branch. Whatever is being worked on.
          #   sha-     every build, for pinning and for bisecting.
          #
          # `release` rather than reusing `latest` for it: a homelab that
          # pulled `latest` yesterday would silently change channel under it.
          tags: |
            type=raw,value=release,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref_type == 'branch' && github.ref_name != 'main' }}
            type=sha,format=short
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Both, because the README's first line is a `docker run` of this
          # image and a homelab is as likely to be a Raspberry Pi or an Apple
          # Silicon Mac as it is to be an x86 box. Published amd64-only, that
          # command fails outright with "no matching manifest", which is a poor
          # first impression of a project whose whole pitch is that you do not
          # need a checkout.
          platforms: linux/amd64,linux/arm64
          push: true
          load: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image runs and speaks for itself
        run: |
          set -eux
          IMAGE=$(echo '${{ steps.meta.outputs.tags }}' | head -1)
          # Both architectures are published; this runner exercises the one it
          # can run. `docker buildx imagetools` is what checks the other is
          # actually there, rather than assuming the platforms line worked.
          # The plain output rather than a JSON template: `{{ json . }}` is
          # pretty-printed, so a grep for '"architecture":"arm64"' matches
          # nothing and fails a build that in fact published both.
          docker buildx imagetools inspect "$IMAGE" | tee /tmp/manifest.txt
          grep -q 'linux/amd64' /tmp/manifest.txt
          grep -q 'linux/arm64' /tmp/manifest.txt
          docker run --rm "$IMAGE" --help
          docker run --rm "$IMAGE" init-db
          # It has to be able to lay out a deployment, or the whole point of
          # publishing it is lost — you would still need the repo.
          mkdir -p /tmp/deploy
          # `--user`, exactly as the README says to run it: the image is uid
          # 10001 and a Linux bind mount keeps host ownership, so without this
          # it cannot write into a directory the invoking user owns.
          docker run --rm --user "$(id -u):$(id -g)" \
            -v /tmp/deploy:/out "$IMAGE" init-deploy /out
          test -f /tmp/deploy/docker-compose.yml
          test -f /tmp/deploy/config/radicale/config
          test -f /tmp/deploy/config/radicale/rights
          test -f /tmp/deploy/config/radicale/rights.anonymous
