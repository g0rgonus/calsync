# Build the image, and prove the thing inside it works.
#
# A workflow that only ran `docker build` would go green on an image whose sync
# loop is broken — the build does not import the package, let alone exercise it.
# So the image job is last and depends on the tests.
#
# The acceptance job is the one worth having. `docs/deployment/radicale.md`
# records that the R1-R8 server requirements were once verified by hand, against
# a server that no longer exists, on a version nobody pinned. That is the
# weakest link in the project: every other layer has fast offline tests, and the
# one place calsync meets a real CalDAV server was checked manually. Running it
# on every push is what `scripts/dev-stack.sh` was written to make possible.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The floor from pyproject. Testing the oldest supported version is
          # the useful end: a newer one passing says nothing about it.
          python-version: "3.11"
      - run: pip install -e '.[dev]'
      - run: pytest -q

  acceptance:
    name: acceptance (live Radicale)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[dev]'
      # `scripts/dev-stack.sh` generates the Radicale users file with bcrypt,
      # which needs htpasswd. Plain-text entries would be accepted by the server
      # and silently defeat the point (deploy/radicale/config).
      - name: Install htpasswd
        run: sudo apt-get update && sudo apt-get install -y apache2-utils
      - name: Bring up the stack
        run: scripts/dev-stack.sh
      - name: Wait for Radicale
        run: |
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:5232/ -o /dev/null && exit 0
            sleep 2
          done
          echo "Radicale never came up" >&2
          docker compose logs radicale
          exit 1
      - name: Run the acceptance checks
        env:
          CALSYNC_ACCEPTANCE: "1"
        run: pytest tests/test_acceptance.py -q
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs

  deploy:
    name: deploy (linux first run)
    runs-on: ubuntu-latest
    # The documented first-run steps, followed exactly, on Linux — because both
    # of the bugs that left a real deployment writing nothing for days were in
    # this path and neither was reachable from the other jobs. `dev-stack.sh`
    # does not cover it: it hands the password to the container by environment,
    # which is right for a laptop running the tests but sidesteps the mounted
    # file that a deployment actually reads.
    steps:
      - uses: actions/checkout@v4
      - name: Install htpasswd
        run: sudo apt-get update && sudo apt-get install -y apache2-utils
      - name: Follow the documented first run
        run: |
          set -eux
          mkdir -p config/radicale secrets
          cp -r deploy/radicale/. config/radicale/
          htpasswd -bBc config/radicale/users calsync deploy-test-password
          htpasswd -bB  config/radicale/users calreader deploy-test-password
          printf '{"radicale_password":"deploy-test-password"}' > secrets/secrets.json
          chmod 600 secrets/secrets.json
          # The step the docs used to omit. A bind mount preserves host
          # ownership on Linux, and the image runs as uid 10001.
          sudo chown -R 10001:10001 secrets
          docker compose up -d radicale
      - name: Configure and check, reading the mounted secrets file
        run: |
          set -eux
          docker compose run --rm calsync set radicale_url http://radicale:5232
          # No CALSYNC_SECRET_* here on purpose: this has to resolve the
          # password through the mount, which is what a deployment does.
          docker compose run --rm calsync check
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs

  image:
    name: image
    runs-on: ubuntu-latest
    # Both, because an image that builds and cannot sync is not a good image.
    needs: [tests, acceptance, deploy]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          # Not pushed. `docker-compose.yml` uses `build: .`, so nothing
          # consumes a registry image today; publishing is a deployment decision
          # that comes with a compose change, not a CI default.
          push: false
          load: true
          tags: calsync:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image runs and speaks for itself
        run: |
          docker run --rm calsync:ci --help
          docker run --rm calsync:ci init-db
